name = "personal-agent-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[assets]
directory = "../admin/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[workflows]]
name = "workflow-skill-runner"
binding = "WORKFLOW_SKILL_RUNNER"
class_name = "WorkflowSkillRunner"

[triggers]
crons = [ "* * * * *" ]

[[d1_databases]]
binding = "DB"
database_name = "personal-agent-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
TELEGRAM_BOT_USERNAME = "taozang_agent_bot"
OWNER_TG_USER_ID = "0"
LLM_API_BASE_URL = "https://api.openai.com"
LLM_MODEL = "gpt-4.1-mini"
LLM_MAX_TOOL_ROUNDS = "3"
FETCH_URL_MAX_BYTES = "200000"
