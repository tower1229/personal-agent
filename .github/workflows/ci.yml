name: CI

on:
  push:
  pull_request:

jobs:
  build-test-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Mock eval
        run: npm run eval:mock
        env:
          NODE_ENV: test
          TELEGRAM_BOT_TOKEN: ci-telegram-token
          OPENAI_API_KEY: ci-openai-key
          OPENAI_MODEL: ci-mock-model
          EMBEDDING_PROVIDER: ci
          EMBEDDING_MODEL: ci-mock-embedding
          USER_TIMEZONE: Asia/Shanghai
          DATABASE_URL: data/ci-eval.sqlite
          ADMIN_TOKEN: ci-admin-token
